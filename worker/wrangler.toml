# Cloudflare Worker + Durable Objects sync server. Free plan is enough.
#   pnpm --filter whiteboard-worker exec wrangler login
#   pnpm --filter whiteboard-worker deploy
name = "whiteboard-sync"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Browser origin allowed to call the API. Set to your deployed app's origin.
CORS_ORIGIN = "https://whiteboard-smoky-pi.vercel.app"

[durable_objects]
bindings = [{ name = "BOARD_ROOM", class_name = "BoardRoom" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoardRoom"]

[observability]
enabled = true
